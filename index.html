<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反诈中心提示</title>
    <link rel="icon" href="source/favicon.ico">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <!-- 顶部机构标识区域 -->
    <header class="header">
        <div class="org-logo">
            <img src="source/DM_20260618145830_001.png" alt="中华人民共和国公安部">
        </div>
        <div class="org-logo">
            <img src="source/DM_20260618145835_001.png" alt="中华人民共和国工业和信息化部">
        </div>
        <div class="org-logo">
            <img src="source/DM_20260618145841_001.png" alt="中国移动">
        </div>
    </header>

    <!-- 中间警告信息区域 -->
    <main class="main-content">
        <div class="main-sections">
            <div class="main-icons-row">
                <div class="main-icon">
                    <img src="source/DM_20260618145850_001.png" alt="国家反诈中心">
                </div>
                <div class="main-icon">
                    <img src="source/DM_20260618145935_001.png" alt="工信部反诈中心">
                </div>
                <div class="main-icon">
                    <img src="source/DM_20260618145945_001.png" alt="中国移动">
                </div>
            </div>
            <div class="main-titles-row">
                <p class="section-title">国家反<span class="align-target boundary"></span>诈中心</p>
                <div class="title-separator">、</div>
                <p class="section-title">工信部<span class="align-target">反</span>诈中心</p>
                <div class="title-separator">、</div>
                <p class="section-title">中国移<span class="align-target">动</span>提示您</p>
            </div>
        </div>

        <div class="divider"></div>

        <div class="warning-box">
            <p class="warning-text">
                您访问的网站/网页存在<span class="highlight">诈骗风险</span>，请注意个人信息和财产安全
            </p>
        </div>

        <p class="contact-info">
            涉诈举报电话：110 或 96110；域名申诉电话：010-67825170 或 010-67825169 或 18600096110
        </p>
    </main>

    <!-- 底部二维码区域 -->
    <footer class="footer">
        <div class="qr-section">
            <div class="qr-row">
                <div class="qr-group">
                    <h3 class="qr-title">国家反诈中心</h3>
                    <div class="qr-codes-left">
                        <div class="qr-item">
                            <img src="source/DM_20260618145954_001.png" alt="国家反诈中心安卓下载">
                            <img src="source/DM_20260618150005_001.png" alt="安卓下载" class="platform-tag">
                        </div>
                        <div class="qr-item">
                            <img src="source/DM_20260618150014_001.png" alt="国家反诈中心苹果下载">
                            <img src="source/DM_20260618150023_001.png" alt="苹果下载" class="platform-tag">
                        </div>
                    </div>
                </div>
                <div class="qr-divider"></div>
                <div class="qr-group">
                    <h3 class="qr-title">工信部反诈专班</h3>
                    <div class="qr-codes-right">
                        <div class="qr-item">
                            <img src="source/DM_20260618150026_001.png" alt="工信部反诈专班">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="beian">
            皖ICP备13003513号
        </div>
    </footer>

    <script src="static/js/main.js"></script>
</body>
</html>
